# AWS 17 — EventBridge Scheduler → SNS
#
# An hourly schedule that publishes to an SNS topic, using EventBridge
# Scheduler: the target is a property of the schedule itself (no separate
# aws:cloudwatch/eventTarget object — the provider cannot read a target back
# from its bare id, so a standalone target orphans on stateless delete). The
# schedule assumes a role whose inline policy is scoped to this topic.
#
#   suffix ─> topic ─┬─> role (inline sns:Publish on the topic)
#                    └─> schedule (target: topic + role)
apiVersion: do.pulumi.com/v1alpha1
kind: DoCompositeDefinition
metadata:
  name: aws-schedule-sns
spec:
  resources:
    - name: suffix
      type: random:index/randomString:RandomString
      package: random@4.21.0
      properties:
        length: 6
        special: false
        upper: false
        numeric: true
    - name: topic
      type: aws:sns/topic:Topic
      package: aws@7.34.0
      properties:
        name: ${self.name}-tick-${resources.suffix.id}
        tags:
          managed-by: doplane
          env: ${params.env}
    - name: role
      type: aws:iam/role:Role
      package: aws@7.34.0
      properties:
        name: ${self.name}-scheduler-${resources.suffix.id}
        assumeRolePolicy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"scheduler.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        inlinePolicies:
          - name: publish
            policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sns:Publish","Resource":"${resources.topic.outputs.arn}"}]}'
        tags:
          managed-by: doplane
          env: ${params.env}
    - name: schedule
      type: aws:scheduler/schedule:Schedule
      package: aws@7.34.0
      properties:
        name: ${self.name}-hourly-${resources.suffix.id}
        scheduleExpression: rate(1 hour)
        flexibleTimeWindow:
          mode: "OFF"
        target:
          arn: ${resources.topic.outputs.arn}
          roleArn: ${resources.role.outputs.arn}
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: cron-dev
spec:
  definition: aws-schedule-sns
  parameters:
    env: dev
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: cron-prod
spec:
  definition: aws-schedule-sns
  parameters:
    env: prod
