# AWS 22 — AWS AppConfig application
#
# Feature-flag / dynamic-config plumbing: an AppConfig application, a freeform
# (hosted) configuration profile, and a linear deployment strategy. Profile
# references the application id. All free.
#
# Why no aws:appconfig/environment: the provider cannot read an environment
# back from its composite "envId:appId" id, so stateless delete calls
# DeleteEnvironment with empty ids and fails; the deployment strategy (plain
# id) deletes cleanly and completes the deployment story.
#
#   suffix ─> app ─> profile
#            strategy
apiVersion: do.pulumi.com/v1alpha1
kind: DoCompositeDefinition
metadata:
  name: aws-appconfig
spec:
  resources:
    - name: suffix
      type: random:index/randomString:RandomString
      package: random@4.21.0
      properties:
        length: 6
        special: false
        upper: false
        numeric: true
    - name: app
      type: aws:appconfig/application:Application
      package: aws@7.34.0
      properties:
        name: ${self.name}-${resources.suffix.id}
        description: Feature config for ${self.name}
        tags:
          managed-by: doplane
          env: ${params.env}
    - name: profile
      type: aws:appconfig/configurationProfile:ConfigurationProfile
      package: aws@7.34.0
      properties:
        applicationId: ${resources.app.id}
        name: ${self.name}-flags
        locationUri: hosted
        type: AWS.Freeform
        tags:
          managed-by: doplane
    - name: strategy
      type: aws:appconfig/deploymentStrategy:DeploymentStrategy
      package: aws@7.34.0
      properties:
        name: ${self.name}-linear-${resources.suffix.id}
        deploymentDurationInMinutes: 10
        growthFactor: 25
        growthType: LINEAR
        finalBakeTimeInMinutes: 0
        replicateTo: NONE
        description: Linear 25% rollout for ${self.name}
        tags:
          managed-by: doplane
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: flags-dev
spec:
  definition: aws-appconfig
  parameters:
    env: dev
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: flags-prod
spec:
  definition: aws-appconfig
  parameters:
    env: prod
