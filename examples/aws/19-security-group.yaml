# AWS 19 — VPC security group (inline rules)
#
# A web-tier security group in a VPC with its HTTP/HTTPS ingress and
# all-egress rules declared inline on the group itself.
#
# Why inline rather than the standalone aws:vpc/securityGroup*Rule resources:
# the provider cannot read those rules back from their bare sgr- id (refresh
# reports not-found), so stateless delete revokes with an empty GroupId and
# fails. Inline rules live and die with the group — one resource, clean
# teardown.
#
#   suffix ─> vpc ─> sg (inline http/https ingress + all egress)
apiVersion: do.pulumi.com/v1alpha1
kind: DoCompositeDefinition
metadata:
  name: aws-security-group
spec:
  resources:
    - name: suffix
      type: random:index/randomString:RandomString
      package: random@4.21.0
      properties:
        length: 6
        special: false
        upper: false
        numeric: true
    - name: vpc
      type: aws:ec2/vpc:Vpc
      package: aws@7.34.0
      properties:
        cidrBlock: 10.40.0.0/16
        tags:
          Name: ${self.name}-${resources.suffix.id}
          env: ${params.env}
    - name: sg
      type: aws:ec2/securityGroup:SecurityGroup
      package: aws@7.34.0
      properties:
        name: ${self.name}-web-${resources.suffix.id}
        description: Web tier for ${self.name}
        vpcId: ${resources.vpc.id}
        ingress:
          - description: HTTP
            protocol: tcp
            fromPort: 80
            toPort: 80
            cidrBlocks:
              - 0.0.0.0/0
          - description: HTTPS
            protocol: tcp
            fromPort: 443
            toPort: 443
            cidrBlocks:
              - 0.0.0.0/0
        egress:
          - description: All egress
            protocol: "-1"
            fromPort: 0
            toPort: 0
            cidrBlocks:
              - 0.0.0.0/0
        tags:
          managed-by: doplane
          env: ${params.env}
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: web-dev
spec:
  definition: aws-security-group
  parameters:
    env: dev
---
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: web-prod
spec:
  definition: aws-security-group
  parameters:
    env: prod
