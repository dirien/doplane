# Level 7 — DigitalOcean graph, served as a typed platform API with
# outputs (requires a DigitalOcean token in the provider-credentials
# Secret). This creates billable infrastructure: a small Droplet plus
# no/low-cost support resources per instance. Delete the instances when you
# are done.
#
#   suffix ─┬─> tag ─────┬─> droplet ──> project-assignment
#           │            └─> firewall
#           ├─> vpc ─────────┘
#           └─> project ─────> project-assignment
#
# The definition publishes outputs — the nginx URL, the droplet's public
# IP and its URN — on every instance's status.outputs, and serves the graph
# as `kind: WebNode` in the platform group web.ediri.io with a URL printer
# column. That group has to be on the operator's install-time allowlist:
#
#   helm upgrade doplane oci://ghcr.io/dirien/charts/doplane \
#     --namespace doplane-system --reuse-values \
#     --set 'compositeApiGroups={web.ediri.io}'
#
# DigitalOcean credentials (the provider reads DIGITALOCEAN_TOKEN or
# DIGITALOCEAN_ACCESS_TOKEN):
#   kubectl -n doplane-system create secret generic provider-credentials \
#     --from-literal=DIGITALOCEAN_TOKEN="$DIGITALOCEAN_TOKEN"
apiVersion: do.pulumi.com/v1alpha1
kind: DoCompositeDefinition
metadata:
  name: digitalocean-web-node
spec:
  api:
    group: web.ediri.io
    kind: WebNode
    parametersSchema:
      type: object
      required:
        - env
      properties:
        env:
          type: string
          enum:
            - dev
            - staging
            - prod
        region:
          type: string
          default: nyc3
    additionalPrinterColumns:
      - name: URL
        type: string
        jsonPath: .status.outputs.url
  outputs:
    url: http://${resources.droplet.outputs.ipv4Address}
    ipv4Address: ${resources.droplet.outputs.ipv4Address}
    dropletUrn: ${resources.droplet.outputs.dropletUrn}
    project: ${resources.project.id}
  resources:
    - name: suffix
      type: random:index/randomString:RandomString
      package: random@4.21.0
      properties:
        length: 6
        lower: true
        minLower: 3
        minNumeric: 2
        numeric: true
        special: false
        upper: false
    - name: tag
      type: digitalocean:index/tag:Tag
      package: digitalocean@4.73.0
      properties:
        name: ${self.name}-${params.env}-${resources.suffix.outputs.result}
    - name: vpc
      type: digitalocean:index/vpc:Vpc
      package: digitalocean@4.73.0
      properties:
        name: ${self.name}-${params.env}-${resources.suffix.outputs.result}
        region: ${params.region}
        # No ipRange: DigitalOcean picks a free range per VPC, so several
        # instances can share a region (a fixed range would collide).
        description: Managed by doplane
    - name: project
      type: digitalocean:index/project:Project
      package: digitalocean@4.73.0
      properties:
        name: ${self.name}-${params.env}-${resources.suffix.outputs.result}
        description: Managed by doplane
        environment: Development
        purpose: Web Application
    - name: droplet
      type: digitalocean:index/droplet:Droplet
      package: digitalocean@4.73.0
      properties:
        name: ${self.name}-${params.env}-${resources.suffix.outputs.result}
        region: ${params.region}
        image: ubuntu-24-04-x64
        size: s-1vcpu-1gb
        backups: false
        monitoring: true
        tags:
          - ${resources.tag.outputs.name}
        vpcUuid: ${resources.vpc.id}
        userData: |
          #cloud-config
          package_update: true
          packages:
            - nginx
          runcmd:
            - systemctl enable --now nginx
    - name: firewall
      type: digitalocean:index/firewall:Firewall
      package: digitalocean@4.73.0
      properties:
        name: ${self.name}-${params.env}-${resources.suffix.outputs.result}
        tags:
          - ${resources.tag.outputs.name}
        inboundRules:
          - protocol: tcp
            portRange: "22"
            sourceAddresses:
              - 0.0.0.0/0
              - ::/0
          - protocol: tcp
            portRange: "80"
            sourceAddresses:
              - 0.0.0.0/0
              - ::/0
        outboundRules:
          - protocol: tcp
            portRange: "1-65535"
            destinationAddresses:
              - 0.0.0.0/0
              - ::/0
          - protocol: udp
            portRange: "1-65535"
            destinationAddresses:
              - 0.0.0.0/0
              - ::/0
          - protocol: icmp
            destinationAddresses:
              - 0.0.0.0/0
              - ::/0
    - name: project-assignment
      type: digitalocean:index/projectResources:ProjectResources
      package: digitalocean@4.73.0
      properties:
        project: ${resources.project.id}
        resources:
          - ${resources.droplet.outputs.dropletUrn}
---
# Raw composite instance: parameters are passed to the definition directly.
# Both instances below create their own Droplet.
apiVersion: do.pulumi.com/v1alpha1
kind: DoComposite
metadata:
  name: do-web-dev
spec:
  definition: digitalocean-web-node
  parameters:
    env: dev
    region: nyc3
---
# Typed instance of the same definition through the platform API. The
# apiserver enforces the parameter schema (env enum, region default), and
# `kubectl get webnodes` shows the nginx URL once the droplet reports its IP.
# (Wait for the API to be served first:
#   kubectl wait --for=condition=Established crd/webnodes.web.ediri.io --timeout=1m)
apiVersion: web.ediri.io/v1alpha1
kind: WebNode
metadata:
  name: web-typed
spec:
  env: staging
